{% load static %}<article class="product-card"><a class="product-art"
   href="{% url 'product_detail' product.slug %}"
   aria-label="View {{ product.name }}"><span class="product-tag">{{ product.category }}</span>{% if product.image_url %}<img src="{{ product.image_url }}" alt="{{ product.name }}" loading="lazy">{% else %}<img src="{% static product.image_asset %}"
     alt="Illustration of {{ product.name }}"
     loading="lazy">{% endif %}</a><div class="product-meta"><span>{{ product.brand }} · {{ product.storage }}</span><a href="{% url 'product_detail' product.slug %}"><h3>{{ product.name }}</h3></a><div class="product-bottom"><strong>₹{{ product.price|floatformat:0 }}</strong><form method="post" action="{% url 'cart_add' product.id %}">{% csrf_token %}<input type="hidden" name="quantity" value="1"><input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="round-add"
        type="submit"
        aria-label="Add {{ product.name }} to bag"
        {% if not product.stock %}disabled{% endif %}>+</button></form></div></div></article>
